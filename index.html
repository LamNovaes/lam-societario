<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAM Societário</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#16233d;
    --navy-2:#1f3358;
    --slate:#2d4159;
    --paper:#f6f4ee;
    --paper-2:#efece2;
    --ink:#1a1f2b;
    --muted:#68707f;
    --line:#dcd6c6;
    --gold:#b5892b;
    --gold-soft:#f1e6c8;
    --green:#3a7d5c;
    --green-soft:#e3ede7;
    --red:#a53b3b;
    --red-soft:#f3e4e2;
    --amber:#b5892b;
    --amber-soft:#f1e6c8;
    --radius:10px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px;
    flex:0 0 230px;
    background:var(--navy);
    color:#e9ecf3;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:2px;
  }
  .brand-logo-card{
    background:#fbfaf6;
    border-radius:8px;
    padding:10px 12px;
    display:flex;
    align-items:center;
  }
  .brand-logo-card img{
    display:block;
    width:100%;
    height:auto;
  }
  .brand small{
    display:block;
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#93a0bd;
  }
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    color:#c7cfe0;
    border:1px solid transparent;
    transition:background .12s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.08);}
  .nav-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .nav-count{
    font-family:var(--mono);
    font-size:11px;
    color:#8d97ad;
    background:rgba(255,255,255,.06);
    padding:1px 6px;
    border-radius:20px;
  }
  .nav-item.active .nav-count{color:#fff;background:rgba(255,255,255,.15);}
  .nav-sep{height:1px;background:rgba(255,255,255,.1);margin:14px 2px;}
  .sidebar-foot{margin-top:auto;padding-top:16px;font-size:11px;color:#6d7791;line-height:1.5;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:20px 30px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;top:0;z-index:5;
  }
  .topbar h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:22px;
    margin:0;
    flex:0 0 auto;
  }
  .search-wrap{flex:1;max-width:360px;position:relative;}
  .search-wrap input{
    width:100%;
    padding:8px 12px 8px 30px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    background:#fff;
    color:var(--ink);
  }
  .search-wrap input:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);}
  .btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:opacity .12s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{background:transparent;color:var(--red);border-color:#e3c9c6;}
  .btn-danger:hover{background:var(--red-soft);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .spacer{flex:1;}

  .content{padding:24px 30px 60px;flex:1;}
  .status-toggle{display:flex;gap:6px;margin-bottom:18px;}
  .chip{
    font-size:12px;padding:6px 12px;border-radius:20px;
    border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .empty-state{
    text-align:center;padding:70px 20px;color:var(--muted);
    border:1px dashed var(--line);border-radius:12px;
  }
  .empty-state .glyph{font-size:28px;margin-bottom:10px;}
  .empty-state h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0 0 6px;}

  /* ---------- Card ---------- */
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .1s ease;
    display:flex;flex-direction:column;gap:10px;
  }
  .card:hover{box-shadow:0 6px 18px rgba(22,35,61,.08);transform:translateY(-1px);}
  .card-top{display:flex;align-items:center;gap:8px;}
  .badge{
    font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 9px;border-radius:20px;
  }
  .badge-abertura{background:var(--green-soft);color:var(--green);}
  .badge-alteracao{background:var(--amber-soft);color:var(--amber);}
  .badge-encerramento{background:var(--red-soft);color:var(--red);}
  .badge-status{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--paper-2);text-transform:none;font-weight:600;}
  .card-client{font-family:var(--serif);font-size:17px;line-height:1.3;}
  .card-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
  .card-meta span.cnpj{font-family:var(--mono);}
  .card-value{font-family:var(--mono);font-size:14px;color:var(--gold);font-weight:600;}

  .tracker{display:flex;align-items:center;margin:2px 0 0;}
  .tracker-dot{
    width:9px;height:9px;border-radius:50%;background:var(--line);
    border:2px solid var(--line);flex:0 0 auto;
  }
  .tracker-dot.done{background:var(--navy-2);border-color:var(--navy-2);}
  .tracker-dot.current{background:#fff;border-color:var(--gold);width:11px;height:11px;box-shadow:0 0 0 3px var(--gold-soft);}
  .tracker-line{flex:1;height:2px;background:var(--line);}
  .tracker-line.done{background:var(--navy-2);}
  .card-stage-label{font-size:12px;color:var(--slate);}
  .card-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--paper-2);padding-top:9px;}

  /* ---------- Dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat-card .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .stat-card .stat-value{font-family:var(--serif);font-size:26px;color:var(--ink);}
  .stat-card .stat-value.gold{color:var(--gold);font-family:var(--mono);font-size:21px;}
  .charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;}
  .chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;}
  .chart-card h3{font-family:var(--serif);font-weight:400;font-size:16px;margin:0 0 4px;}
  .chart-card .sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .donut{
    width:150px;height:150px;border-radius:50%;flex:0 0 150px;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .donut-hole{
    width:92px;height:92px;border-radius:50%;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .donut-hole .n{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1;}
  .donut-hole .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-top:3px;}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:140px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);}
  .legend-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}
  .legend-row .legend-pct{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:11.5px;}
  .chart-empty{color:var(--muted);font-size:13px;padding:20px 0;}

  /* ---------- Deadlines / Agenda ---------- */
  .deadline-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .deadline-badge.overdue{background:var(--red-soft);color:var(--red);}
  .deadline-badge.today{background:var(--amber-soft);color:var(--amber);}
  .deadline-badge.soon{background:var(--amber-soft);color:var(--amber);}
  .deadline-badge.ok{background:var(--green-soft);color:var(--green);}
  .agenda-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;}
  .agenda-row:hover{box-shadow:0 4px 12px rgba(22,35,61,.06);}
  .agenda-row .agenda-main{flex:1;min-width:0;}
  .agenda-row .agenda-title{font-size:13.5px;color:var(--ink);font-weight:600;}
  .agenda-row .agenda-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .agenda-section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:18px 0 8px;}
  .agenda-section-title:first-child{margin-top:0;}

  /* ---------- Timeline ---------- */
  .timeline-item{display:flex;gap:10px;padding:8px 2px;font-size:12.5px;}
  .timeline-item .t-date{flex:0 0 108px;color:var(--muted);font-family:var(--mono);font-size:11px;padding-top:1px;}
  .timeline-item .t-text{flex:1;color:var(--ink);}
  .timeline-empty{font-size:12px;color:var(--muted);padding:4px 0;}

  /* ---------- Tarefas ---------- */
  .task-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;}
  .task-row.done{opacity:.55;}
  .task-check{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 20px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
  }
  .task-check.checked{background:var(--green);border-color:var(--green);}
  .task-main{flex:1;min-width:0;}
  .task-title{font-size:13.5px;color:var(--ink);font-weight:600;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--muted);}
  .task-sub{font-size:12px;color:var(--muted);margin-top:2px;}

  /* ---------- Kanban ---------- */
  .kanban-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;}
  .kanban-col{
    flex:0 0 260px;background:var(--paper-2);border-radius:10px;padding:10px;
    min-height:120px;
  }
  .kanban-col.dragover{background:var(--gold-soft);}
  .kanban-col-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;color:var(--slate);padding:4px 6px 10px;display:flex;justify-content:space-between;}
  .kanban-card{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;
    cursor:grab;font-size:12.5px;
  }
  .kanban-card:active{cursor:grabbing;}
  .kanban-card .kc-client{font-weight:600;color:var(--ink);margin-bottom:3px;}
  .kanban-card .kc-sub{color:var(--muted);font-size:11.5px;}

  /* ---------- Drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(22,25,35,.35);
    display:none;align-items:stretch;justify-content:flex-end;z-index:50;
  }
  .overlay.open{display:flex;}
  .drawer{
    width:460px;max-width:92vw;background:var(--paper);height:100%;
    overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);
    padding:26px 26px 40px;
    animation:slidein .18s ease;
  }
  @keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .drawer-title{font-family:var(--serif);font-size:20px;}
  .drawer-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    font-size:13.5px;font-family:var(--sans);background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;}

  .stage-list{margin-top:8px;display:flex;flex-direction:column;}
  .stage-row{
    display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer;
    border-radius:7px;
  }
  .stage-row:hover{background:var(--paper-2);}
  .stage-num{
    width:22px;height:22px;border-radius:50%;flex:0 0 22px;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-family:var(--mono);font-weight:700;
    border:2px solid var(--line);color:var(--muted);background:#fff;
  }
  .stage-row.done .stage-num{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}
  .stage-row.current .stage-num{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);}
  .stage-connector{width:2px;height:14px;background:var(--line);margin-left:10px;}
  .stage-connector.done{background:var(--navy-2);}
  .stage-text{font-size:13.5px;color:var(--ink);}
  .stage-row.done .stage-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
  .stage-row.current .stage-text{font-weight:600;}

  .drawer-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .status-pill{
    display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;margin-bottom:16px;
  }
  .status-pill.em_andamento{background:var(--amber-soft);color:var(--amber);}
  .status-pill.concluido{background:var(--green-soft);color:var(--green);}
  .status-pill.cancelado{background:var(--red-soft);color:var(--red);}

  /* ---------- Settings ---------- */
  .settings-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .settings-block h3{font-family:var(--serif);font-weight:400;font-size:16px;margin:0 0 4px;}
  .settings-block .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .price-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--paper-2);}
  .price-row:last-child{border-bottom:none;}
  .price-row .badge{width:130px;flex:0 0 130px;text-align:center;}
  .price-row input{width:150px;font-family:var(--mono);}
  .stage-edit-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .stage-edit-row{display:flex;align-items:center;gap:6px;}
  .stage-edit-row input{flex:1;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;}
  .icon-btn{
    background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;flex:0 0 26px;
  }
  .icon-btn:hover{background:var(--paper-2);}
  .add-stage-row{display:flex;gap:6px;margin-top:10px;}
  .add-stage-row input{flex:1;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;
    font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s ease, bottom .2s ease;
  }
  .toast.show{opacity:1;bottom:30px;}

  @media (max-width:760px){
    .sidebar{width:74px;flex:0 0 74px;padding:16px 8px;}
    .brand small,.nav-item span.label,.sidebar-foot{display:none;}
    .nav-item{justify-content:center;}
    .nav-count{display:none;}
    .topbar{padding:16px;flex-wrap:wrap;}
    .content{padding:16px;}
    .drawer{width:100vw;}
  }

  /* ---------- Login ---------- */
  .login-screen{
    flex:1 1 100%;width:100%;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);padding:20px;
  }
  .login-card{
    background:#fff;border-radius:12px;padding:34px 32px;width:100%;max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .login-card .brand-logo-card{background:var(--paper);margin-bottom:22px;}
  .login-card h2{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 4px;}
  .login-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;}
  .login-error{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:9px 11px;border-radius:7px;margin-bottom:14px;display:none;}
  .login-error.show{display:block;}
  .login-link{font-size:12.5px;color:var(--navy-2);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;margin-top:10px;}
  .config-missing{
    background:var(--amber-soft);color:var(--amber);font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:16px;line-height:1.5;
  }
  .account-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#aab3c8;margin-top:10px;}
  .account-row button{background:none;border:none;color:#aab3c8;text-decoration:underline;cursor:pointer;font-size:11.5px;padding:0;}
</style>
</head>
<body>

// ---------------------------------------------------------------
// CONFIGURAÇÃO DO SUPABASE
// A URL do projeto e a chave pública do Supabase ficam no arquivo
// config.js (ao lado deste), preenchido uma única vez conforme o guia
// de instalação. Essas duas informações são feitas para ficar visíveis
// no site: a proteção de verdade vem das regras de segurança (RLS) e do
// cadastro fechado, configurados dentro do Supabase.
// ---------------------------------------------------------------
const _cfg = window.LAM_CONFIG || {};
const SUPABASE_URL = (_cfg.SUPABASE_URL || 'COLE_AQUI_A_PROJECT_URL').trim();
const SUPABASE_ANON_KEY = (_cfg.SUPABASE_ANON_KEY || 'COLE_AQUI_A_CHAVE_ANON_PUBLIC').trim();
const SUPABASE_CONFIGURED = !SUPABASE_URL.startsWith('COLE_AQUI') && !SUPABASE_ANON_KEY.startsWith('COLE_AQUI');

// Os links de convite e de "esqueci minha senha" chegam aqui com um código
// no endereço (depois do #). O Supabase apaga esse código assim que lê,
// então guardamos uma cópia antes de criar o cliente, para saber que a
// pessoa acabou de chegar por um desses links e precisa definir a senha.
const INITIAL_HASH = window.location.hash || '';
let NEEDS_PASSWORD_SETUP = /type=(invite|recovery)/.test(INITIAL_HASH);
const LOGIN_NOTICE = /error_code=otp_expired|error=access_denied/.test(INITIAL_HASH)
  ? 'O link que você abriu expirou ou já foi usado. Clique em "Esqueci minha senha" para receber um novo, ou peça um novo convite ao administrador.'
  : '';
let currentUserId = '';

let sb = null;
if(SUPABASE_CONFIGURED && window.supabase){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// window.storage é um adaptador fino sobre uma única tabela do Supabase
// (app_data: key text, value text). Dados "compartilhados" ficam com a
// chave original (todo mundo que logar enxerga). Dados "pessoais" (como o
// último nome digitado em "Cadastrado por") recebem o id da pessoa na
// frente da chave, para um usuário não sobrescrever o do outro.
if(sb){
  const scoped = (key, shared) => shared ? key : ('u:' + currentUserId + ':' + key);
  window.storage = {
    async get(key, shared){
      const { data, error } = await sb.from('app_data').select('value').eq('key', scoped(key, shared)).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('key not found: ' + key);
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared){
      const { error } = await sb.from('app_data').upsert({ key: scoped(key, shared), value, updated_at: new Date().toISOString() });
      if(error) throw error;
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      const { error } = await sb.from('app_data').delete().eq('key', scoped(key, shared));
      if(error) throw error;
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      let q = sb.from('app_data').select('key');
      q = q.like('key', scoped(prefix || '', shared) + '%');
      const { data, error } = await q;
      if(error) throw error;
      return { keys: (data||[]).map(r=>r.key), prefix, shared: !!shared };
    },
    // Lê todas as linhas com certo prefixo (já com o conteúdo), de mil em
    // mil, porque o Supabase devolve no máximo 1000 linhas por consulta.
    async listWithValues(prefix){
      const step = 1000;
      let from = 0, all = [];
      while(true){
        const { data, error } = await sb.from('app_data').select('key,value')
          .like('key', prefix + '%').order('key').range(from, from + step - 1);
        if(error) throw error;
        all = all.concat(data || []);
        if(!data || data.length < step) break;
        from += step;
      }
      return all;
    }
  };
} else if(!window.storage){
  // Modo local de emergência: só é usado se o Supabase ainda não foi
  // configurado acima. Sem login, sem compartilhamento entre pessoas —
  // existe apenas para o site não ficar totalmente quebrado enquanto
  // você ainda não colou a URL/chave do Supabase.
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem('lam_' + key);
      if(raw === null){ throw new Error('key not found: ' + key); }
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem('lam_' + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      const existed = localStorage.getItem('lam_' + key) !== null;
      localStorage.removeItem('lam_' + key);
      return { key, deleted: existed, shared: !!shared };
    },
    async list(prefix, shared){
      const p = 'lam_' + (prefix || '');
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith(p))
        .map(k => k.slice(4));
      return { keys, prefix, shared: !!shared };
    },
    async listWithValues(prefix){
      const p = 'lam_' + (prefix || '');
      return Object.keys(localStorage)
        .filter(k => k.startsWith(p))
        .map(k => ({ key: k.slice(4), value: localStorage.getItem(k) }));
    }
  };
}

function fmtBRL(n){

}
function fmtDate(iso){

  return d.toLocaleDateString('pt-BR');
}
function daysBetween(iso, endIso){
  const start = new Date(iso);
  const end = endIso ? new Date(endIso) : new Date();
  return Math.max(0, Math.round((end-start)/86400000));
}

function deadlineStatus(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  const days = Math.round((target - today) / 86400000);
  if(days < 0) return { cls:'overdue', label:`Atrasado há ${Math.abs(days)}d`, days };
  if(days === 0) return { cls:'today', label:'Vence hoje', days };
  if(days <= 3) return { cls:'soon', label:`Vence em ${days}d`, days };
  return { cls:'ok', label:`Vence em ${days}d`, days };
}

function addHistory(p, text){
  if(!p.history) p.history = [];
  p.history.push({ date: new Date().toISOString(), text });
}

// ---------------- storage ----------------
// Cada processo e cada tarefa vive numa linha própria do banco
// (process:<id> e task:<id>). Ao salvar, só o que realmente mudou é
// enviado. Assim, se duas pessoas mexem em processos diferentes ao mesmo
// tempo, uma não apaga o trabalho da outra. (Se as duas mexem no MESMO
// processo ao mesmo tempo, vale a última gravação.)
const COLLECTIONS = {
  processes: { prefix: 'process:', stateKey: 'processes' },
  tasks:     { prefix: 'task:',    stateKey: 'tasks' }
};
const lastSaved = { processes: new Map(), tasks: new Map() }; // id -> JSON como está no servidor
let lastSettingsJson = '';
let pendingSaves = 0;

async function fetchRows(prefix){
  if(window.storage.listWithValues) return await window.storage.listWithValues(prefix);
  const { keys } = await window.storage.list(prefix, true);
  const rows = [];
  for(const k of keys){
    try{ const r = await window.storage.get(k, true); rows.push({ key: k, value: r.value }); }catch(e){}
  }
  return rows;
}

async function loadCollection(name){
  const rows = await fetchRows(COLLECTIONS[name].prefix);
  const arr = [], map = new Map();
  rows.forEach(r=>{
    try{
      const item = JSON.parse(r.value);
      if(item && item.id){ arr.push(item); map.set(item.id, JSON.stringify(item)); }
    }catch(e){ /* linha inválida: ignora */ }
  });
  return { arr, map };
}

function sameMap(a, b){
  if(a.size !== b.size) return false;
  for(const [k, v] of a){ if(b.get(k) !== v) return false; }
  return true;
}

async function saveCollection(name){
  const { prefix, stateKey } = COLLECTIONS[name];
  const last = lastSaved[name];
  const seen = new Set();
  const jobs = [];
  state[stateKey].forEach(item=>{
    seen.add(item.id);
    const json = JSON.stringify(item);
    if(last.get(item.id) !== json){
      jobs.push(window.storage.set(prefix + item.id, json, true).then(()=>{ last.set(item.id, json); }));
    }
  });
  Array.from(last.keys()).forEach(id=>{
    if(!seen.has(id)){
      jobs.push(window.storage.delete(prefix + id, true).then(()=>{ last.delete(id); }));
    }
  });
  if(jobs.length === 0) return;
  pendingSaves++;
  try{ await Promise.all(jobs); }
  catch(e){ showToast('Não foi possível salvar agora. Verifique a conexão e tente de novo.'); }
  finally{ pendingSaves--; }
}
async function saveProcesses(){ return saveCollection('processes'); }
async function saveTasks(){ return saveCollection('tasks'); }

async function saveSettings(){
  try{
    const json = JSON.stringify(state.settings);
    await window.storage.set(STORE_SETTINGS, json, true);
    lastSettingsJson = json;
  }catch(e){ showToast('Erro ao salvar configurações.'); }
}

async function loadSettingsJson(){
  try{
    const s = await window.storage.get(STORE_SETTINGS, true);
    return (s && s.value) ? s.value : null;
  }catch(e){
    if(String(e && e.message).indexOf('key not found') === 0) return null;
    throw e;
  }
}

async function loadState(){
  try{
    const last = await window.storage.get('lastRegisteredBy', false);
    if(last && last.value) state.lastRegisteredBy = last.value;
  }catch(e){ /* ainda não existe */ }

  let procs, tasks, settingsJson;
  try{
    settingsJson = await loadSettingsJson();
    procs = await loadCollection('processes');
    tasks = await loadCollection('tasks');
  }catch(e){
    // Falhou ao ler do servidor: NÃO seguimos (nem criamos exemplos), para
    // nunca confundir "sem conexão" com "ainda não há dados".
    renderLoadError();
    return false;
  }

  if(settingsJson){
    try{ state.settings = JSON.parse(settingsJson); }catch(e){}
  }
  lastSettingsJson = JSON.stringify(state.settings);
  state.processes = procs.arr; lastSaved.processes = procs.map;
  state.tasks = tasks.arr;     lastSaved.tasks = tasks.map;

  if(state.processes.length === 0){
    let seeded = false;
    try{
      const flag = await window.storage.get('seeded', true);
      seeded = !!(flag && flag.value);
    }catch(e){ seeded = false; }
    if(!seeded){
      state.processes = sampleProcesses();
      await saveProcesses();
      state.tasks = sampleTasks(state.processes);
      await saveTasks();
      try{ await window.storage.set('seeded', 'true', true); }catch(e){}
    }
  }
  render();
  return true;
}

// Busca em segundo plano o que os colegas alteraram e atualiza a tela.
// Não mexe em nada enquanto há um painel aberto, um campo sendo digitado
// ou uma gravação em andamento, para nunca atrapalhar quem está editando.
async function refreshFromServer(){
  if(SUPABASE_CONFIGURED && !appStarted) return;
  if(pendingSaves > 0 || state.drawerMode) return;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  try{
    const [procs, tasks, settingsJson] = await Promise.all([
      loadCollection('processes'), loadCollection('tasks'), loadSettingsJson()
    ]);
    if(pendingSaves > 0 || state.drawerMode) return;
    let changed = false;
    if(!sameMap(procs.map, lastSaved.processes)){ state.processes = procs.arr; lastSaved.processes = procs.map; changed = true; }
    if(!sameMap(tasks.map, lastSaved.tasks)){ state.tasks = tasks.arr; lastSaved.tasks = tasks.map; changed = true; }
    if(settingsJson){
      try{
        const parsed = JSON.parse(settingsJson);
        const normalized = JSON.stringify(parsed);
        if(normalized !== lastSettingsJson){ state.settings = parsed; lastSettingsJson = normalized; changed = true; }
      }catch(e){}
    }
    if(changed) render();
  }catch(e){ /* sem conexão agora: tenta de novo no próximo ciclo */ }
}

// Antes de abrir um processo/tarefa para edição, traz a versão mais
// recente dele (outra pessoa pode ter mexido há pouco).
async function refreshItem(name, id){
  if(pendingSaves > 0) return true;
  const { prefix, stateKey } = COLLECTIONS[name];
  try{
    const r = await Promise.race([
      window.storage.get(prefix + id, true),
      new Promise((_, rej)=> setTimeout(()=> rej(new Error('timeout')), 2500))
    ]);
    const item = JSON.parse(r.value);
    const json = JSON.stringify(item);
    const idx = state[stateKey].findIndex(x=>x.id===id);
    if(idx >= 0){
      if(JSON.stringify(state[stateKey][idx]) !== json) state[stateKey][idx] = item;
    } else {
      state[stateKey].push(item);
    }
    lastSaved[name].set(id, json);
    return true;
  }catch(e){
    if(String(e && e.message).indexOf('key not found') === 0){
      state[stateKey] = state[stateKey].filter(x=>x.id!==id);
      lastSaved[name].delete(id);
      showToast('Este item foi removido por outra pessoa.');
      return false;
    }
    return true; // sem conexão: usa a cópia local
  }
}

function agendaItems(){
  const items = [];
  state.processes.forEach(p=>{
    if(p.status!=='em_andamento') return;
    if(p.deadline){
      const ds = deadlineStatus(p.deadline);
      if(ds) items.push({ kind:'processo', label: p.client, sub: TYPE_LABELS_FULL[p.type], date: p.deadline, ds, processId: p.id });
    }
    (p.protocols||[]).forEach(item=>{
      if(item.resolvido || !item.prazo) return;
      const ds = deadlineStatus(item.prazo);
      if(ds) items.push({ kind: item.tipo, label: `${item.orgao}${item.numero ? ' — '+item.numero : ''}`, sub: p.client, date: item.prazo, ds, processId: p.id });
    });
  });
  return items.sort((a,b)=> new Date(a.date) - new Date(b.date));
}

  `;

function trackerHtml(stages, p){
  let html = '';
  const total = stages.length;
  const cur = p.status==='concluido' ? total : p.currentStage;
  for(let i=0;i<total;i++){
    let cls = '';
    if(i<cur) cls='done';
    else if(i===cur && p.status==='em_andamento') cls='current';
    html += `<div class="tracker-dot ${cls}"></div>`;
    if(i<total-1) html += `<div class="tracker-line ${i<cur?'done':''}"></div>`;
  }
  return html;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

    ${statCard('Processos em andamento', emAndamento.length)}
    ${statCard('Concluídos', concluidos.length)}
    ${statCard('Valor em andamento', fmtBRL(valorAndamento), true)}
    ${statCard('Valor faturado (concluídos)', fmtBRL(valorConcluido), true)}
    ${statCard('Ticket médio (concluídos)', fmtBRL(ticketMedio), true)}
  `;
  wrap.appendChild(stats);

  const chartsRow = document.createElement('div');
  chartsRow.className = 'charts-row';

  const typeData = [
    {label:TYPE_LABELS.abertura, value: emAndamento.filter(p=>p.type==='abertura').length, color:'#3a7d5c'},
    {label:TYPE_LABELS.alteracao, value: emAndamento.filter(p=>p.type==='alteracao').length, color:'#b5892b'},
    {label:TYPE_LABELS.encerramento, value: emAndamento.filter(p=>p.type==='encerramento').length, color:'#a53b3b'}
  ];
  chartsRow.appendChild(chartCard('Processos ativos por tipo', 'Distribuição do que está em andamento agora', typeData, emAndamento.length, 'ativos'));

  const statusData = [
    {label:'Em andamento', value: emAndamento.length, color:'#b5892b'},
    {label:'Concluídos', value: concluidos.length, color:'#3a7d5c'},
    {label:'Cancelados', value: cancelados.length, color:'#a53b3b'}
  ];
  chartsRow.appendChild(chartCard('Todos os processos por status', 'Panorama geral desde o início', statusData, state.processes.length, 'processos'));

  const typeAllData = [
    {label:TYPE_LABELS.abertura, value: state.processes.filter(p=>p.type==='abertura').length, color:'#3a7d5c'},
    {label:TYPE_LABELS.alteracao, value: state.processes.filter(p=>p.type==='alteracao').length, color:'#b5892b'},
    {label:TYPE_LABELS.encerramento, value: state.processes.filter(p=>p.type==='encerramento').length, color:'#a53b3b'}
  ];
  chartsRow.appendChild(chartCard('Total histórico por tipo', 'Todos os processos já criados', typeAllData, state.processes.length, 'processos'));

  wrap.appendChild(chartsRow);
  return wrap;
}

function statCard(label, value, isMoney){
  return `<div class="stat-card">
    <div class="stat-label">${label}</div>
    <div class="stat-value ${isMoney?'gold':''}">${value}</div>
  </div>`;
}

function chartCard(title, sub, data, total, unitLabel){
  const card = document.createElement('div');
  card.className = 'chart-card';
  const head = document.createElement('div');
  head.innerHTML = `<h3>${title}</h3><div class="sub">${sub}</div>`;
  card.appendChild(head);
  card.appendChild(donutChart(data, total, unitLabel));
  return card;
}

function donutChart(data, total, unitLabel){
  const wrap = document.createElement('div');
  if(!total){
    wrap.className = 'chart-empty';
    wrap.textContent = 'Sem dados suficientes ainda.';
    return wrap;
  }
  wrap.className = 'donut-wrap';

  let gradient = [];
  let acc = 0;
  data.forEach(seg=>{
    if(seg.value<=0) return;
    const start = (acc/total)*100;
    acc += seg.value;
    const end = (acc/total)*100;
    gradient.push(`${seg.color} ${start}% ${end}%`);
  });
  const donut = document.createElement('div');
  donut.className = 'donut';
  donut.style.background = gradient.length ? `conic-gradient(${gradient.join(',')})` : 'var(--paper-2)';
  donut.innerHTML = `<div class="donut-hole"><div class="n">${total}</div><div class="l">${unitLabel}</div></div>`;
  wrap.appendChild(donut);

  const legend = document.createElement('div');
  legend.className = 'legend';
  data.forEach(seg=>{
    if(seg.value<=0) return;
    const pct = ((seg.value/total)*100).toFixed(1);
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<span class="legend-swatch" style="background:${seg.color}"></span><span>${seg.label}</span><span class="legend-pct">${seg.value} · ${pct}%</span>`;
    legend.appendChild(row);
  });
  wrap.appendChild(legend);
  return wrap;
}

function openNewProcess(){
  state.drawerMode = 'new';
  state.drawerType = (state.view!=='todos' && state.view!=='config' && state.view!=='dashboard' && state.view!=='agenda' && state.view!=='concluidos' && state.view!=='kanban' && state.view!=='tarefas') ? state.view : 'abertura';
  render();
}
async function openDetail(id){
  const ok = await refreshItem('processes', id);
  if(!ok || !state.processes.find(p=>p.id===id)){ render(); return; }
  state.drawerMode = 'detail';
  state.drawerProcessId = id;
  render();
}
function openNewTask(){
  state.drawerMode = 'newTask';
  render();
}
async function openTaskDetail(id){
  const ok = await refreshItem('tasks', id);
  if(!ok || !state.tasks.find(t=>t.id===id)){ render(); return; }
  state.drawerMode = 'task';
  state.drawerTaskId = id;
  render();
}
function closeDrawer(){
  state.drawerMode = null;
  state.drawerProcessId = null;
  state.drawerTaskId = null;
  render();
}

function renderDrawer(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay open';
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDrawer(); });

  const drawer = document.createElement('div');
  drawer.className = 'drawer';
  overlay.appendChild(drawer);

  if(state.drawerMode==='new'){
    drawer.appendChild(renderNewForm());
  } else if(state.drawerMode==='changePassword'){
    drawer.appendChild(renderChangePasswordForm());
  } else if(state.drawerMode==='newTask'){
    drawer.appendChild(renderNewTaskForm());
  } else if(state.drawerMode==='task'){
    const t = state.tasks.find(x=>x.id===state.drawerTaskId);
    if(!t){ closeDrawer(); return overlay; }
    drawer.appendChild(renderTaskDetailForm(t));
  } else {
    const p = state.processes.find(x=>x.id===state.drawerProcessId);
    if(!p){ closeDrawer(); return overlay; }
    drawer.appendChild(renderDetailForm(p));
  }
  return overlay;
}

      row.innerHTML = `
        <span style="flex:0 0 76px;font-size:11px;font-weight:700;color:${item.tipo==='exigencia'?'var(--red)':'var(--slate)'};text-transform:uppercase;${item.resolvido?'opacity:.5;':''}">${item.tipo==='exigencia'?'Exigência':'Protocolo'}</span>

    docs.forEach(doc=>{

  const stageListEl = wrap.querySelector('#stageList');

    if(p.status==='concluido' || idx < p.currentStage) cls = 'done';
    else if(idx === p.currentStage && p.status==='em_andamento') cls = 'current';
    row.className = 'stage-row ' + cls;
    row.innerHTML = `<span class="stage-num">${cls==='done' ? '✓' : idx+1}</span><span class="stage-text">${escapeHtml(s)}</span>`;
    if(p.status==='em_andamento'){
      row.addEventListener('click', ()=>{
        p.currentStage = idx;
        saveProcesses();
        render();
      });
    }
    stageListEl.appendChild(row);
    if(idx<stages.length-1){
      const conn = document.createElement('div');
      conn.className = 'stage-connector' + (idx<p.currentStage || p.status==='concluido' ? ' done':'');
      conn.style.marginLeft = '15px';

    advanceRow.innerHTML = `<button class="btn btn-primary btn-sm" id="advanceBtn">${isLast ? 'Concluir processo' : 'Avançar para próxima etapa →'}</button>`;

        addHistory(p, 'Processo concluído.');
        showToast('Processo concluído.');
      } else {
        p.currentStage += 1;
        addHistory(p, `Etapa avançada para "${stages[p.currentStage]}".`);
        showToast('Etapa avançada.');
      }
      saveProcesses();
      render();
    });
  }

  wrap.querySelector('#closeDrawerBtn').addEventListener('click', closeDrawer);
  wrap.querySelector('#saveBtn').addEventListener('click', ()=>{
    p.client = wrap.querySelector('#d_client').value.trim() || p.client;
    p.cnpj = wrap.querySelector('#d_cnpj').value.trim();
    p.responsible = wrap.querySelector('#d_responsible').value.trim();
    p.registeredBy = wrap.querySelector('#d_registeredBy').value.trim();

    p.deadline = wrap.querySelector('#d_deadline').value || null;
    const honorarioInput = wrap.querySelector('#d_honorario');
    if(honorarioInput) p.honorarioMensal = parseFloat(honorarioInput.value)||0;
    p.notes = wrap.querySelector('#d_notes').value.trim();

    if(newNextAction !== (p.nextAction||'')){
      p.nextAction = newNextAction;
      if(newNextAction) addHistory(p, `Próxima ação definida: ${newNextAction}`);
    }
    saveProcesses();
    showToast('Alterações salvas.');
    render();
  });
  const cancelBtn = wrap.querySelector('#cancelProcBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    if(confirm('Cancelar este processo?')){
      p.status='cancelado';
      addHistory(p, 'Processo cancelado.');
      saveProcesses(); showToast('Processo cancelado.'); render();
    }
  });
  const reopenBtn = wrap.querySelector('#reopenBtn');
  if(reopenBtn) reopenBtn.addEventListener('click', ()=>{
    p.status='em_andamento';
    p.completedAt = null;
    addHistory(p, 'Processo reaberto.');
    saveProcesses(); showToast('Processo reaberto.'); render();
  });
  wrap.querySelector('#deleteBtn').addEventListener('click', ()=>{
    if(confirm('Excluir este processo definitivamente? Essa ação não pode ser desfeita.')){
      state.processes = state.processes.filter(x=>x.id!==p.id);
      saveProcesses();
      showToast('Processo excluído.');
      closeDrawer();
    }
  });

  return wrap;
}

function renderStageEditor(type){
  const block = document.createElement('div');
  block.className = 'settings-block';
  block.innerHTML = `<h3>Etapas — ${TYPE_LABELS_FULL[type]}</h3>
    <div class="sub">Ajuste, reordene ou adicione etapas do fluxo. Processos já criados mantêm o progresso atual.</div>
    <div class="stage-edit-list" data-list="${type}"></div>
    <div class="add-stage-row">
      <input type="text" placeholder="Nova etapa..." data-newstage="${type}">
      <button class="icon-btn" data-addstage="${type}">+</button>
    </div>`;

  const listEl = block.querySelector(`[data-list="${type}"]`);
  state.settings.stages[type].forEach((stage, idx)=>{
    const row = document.createElement('div');
    row.className = 'stage-edit-row';
    row.innerHTML = `
      <button class="icon-btn" data-up="${type}:${idx}" ${idx===0?'disabled':''}>↑</button>
      <button class="icon-btn" data-down="${type}:${idx}" ${idx===state.settings.stages[type].length-1?'disabled':''}>↓</button>
      <input type="text" value="${escapeHtml(stage)}" data-edit="${type}:${idx}">
      <button class="icon-btn" data-del="${type}:${idx}">✕</button>
    `;
    listEl.appendChild(row);
  });

  block.querySelectorAll('[data-edit]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const [t,i] = e.target.getAttribute('data-edit').split(':');
      state.settings.stages[t][i] = e.target.value;
      saveSettings();
    });
  });
  block.querySelectorAll('[data-up]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const [t,i] = e.currentTarget.getAttribute('data-up').split(':');
      const idx = parseInt(i);
      if(idx>0){
        const arr = state.settings.stages[t];
        [arr[idx-1],arr[idx]] = [arr[idx],arr[idx-1]];
        saveSettings(); render();
      }
    });
  });
  block.querySelectorAll('[data-down]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const [t,i] = e.currentTarget.getAttribute('data-down').split(':');
      const idx = parseInt(i);
      const arr = state.settings.stages[t];
      if(idx<arr.length-1){
        [arr[idx+1],arr[idx]] = [arr[idx],arr[idx+1]];
        saveSettings(); render();
      }
    });
  });
  block.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const [t,i] = e.currentTarget.getAttribute('data-del').split(':');
      const idx = parseInt(i);
      if(state.settings.stages[t].length<=1){ showToast('Mantenha ao menos uma etapa.'); return; }
      state.settings.stages[t].splice(idx,1);
      state.processes.forEach(p=>{
        if(p.type===t && p.currentStage>=state.settings.stages[t].length){
          p.currentStage = state.settings.stages[t].length-1;
        }
      });
      saveSettings(); saveProcesses(); render();
    });
  });
  block.querySelector(`[data-addstage="${type}"]`).addEventListener('click', ()=>{
    const input = block.querySelector(`[data-newstage="${type}"]`);
    const val = input.value.trim();
    if(!val) return;
    state.settings.stages[type].push(val);
    saveSettings(); render();
  });

  return block;
}

function openTasksCount(){
  return state.tasks.filter(t=>{
    if(t.status==='concluida') return false;
    const ds = deadlineStatus(t.dueDate);
    return ds && (ds.cls==='overdue' || ds.cls==='today');
  }).length;
}
function filteredTasks(){
  return state.tasks.filter(t=>{
    if(state.search){
      const s = state.search.toLowerCase();
      if(!(t.title.toLowerCase().includes(s) || (t.responsible||'').toLowerCase().includes(s))) return false;
    }
    if(state.taskFilter==='todas') return true;
    const ds = deadlineStatus(t.dueDate);
    if(!ds) return false;
    if(state.taskFilter==='hoje') return ds.cls==='today';
    if(state.taskFilter==='atrasadas') return ds.cls==='overdue';
    if(state.taskFilter==='proximas') return ds.cls==='soon' || ds.cls==='ok';
    return true;
  }).sort((a,b)=>{
    if((a.status==='concluida') !== (b.status==='concluida')) return a.status==='concluida' ? 1 : -1;
    return new Date(a.dueDate||'2999-12-31') - new Date(b.dueDate||'2999-12-31');
  });
}

  const wrap = document.createElement('div');

function renderKanbanContent(){
  const wrap = document.createElement('div');
  wrap.className = 'content';

  const tabs = document.createElement('div');
  tabs.className = 'kanban-tabs';
  ['abertura','alteracao','encerramento'].forEach(type=>{

    chip.addEventListener('click', ()=>{ state.kanbanType = type; render(); });
    tabs.appendChild(chip);
  });
  wrap.appendChild(tabs);

  const boardWrap = document.createElement('div');
  boardWrap.id = 'kanbanBoard';
  boardWrap.appendChild(buildKanbanBoard());
  wrap.appendChild(boardWrap);

  return wrap;
}

function buildKanbanBoard(){
  const type = state.kanbanType;
  const stages = state.settings.stages[type];
  const board = document.createElement('div');
  board.className = 'kanban-board';

  const procsByStage = stages.map(()=>[]);
  state.processes.forEach(p=>{
    if(p.type===type && p.status==='em_andamento'){
      procsByStage[p.currentStage] = procsByStage[p.currentStage] || [];
      procsByStage[p.currentStage].push(p);
    }
  });
  const concluded = state.processes.filter(p=>p.type===type && p.status==='concluido')
    .sort((a,b)=> new Date(b.completedAt) - new Date(a.completedAt)).slice(0,15);

  stages.forEach((stageName, idx)=>{
    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.innerHTML = `<div class="kanban-col-title"><span>${escapeHtml(stageName)}</span><span>${(procsByStage[idx]||[]).length}</span></div>`;
    (procsByStage[idx]||[]).forEach(p=> col.appendChild(kanbanCard(p)));
    wireKanbanColumn(col, type, idx, false);
    board.appendChild(col);
  });

  const doneCol = document.createElement('div');
  doneCol.className = 'kanban-col';
  doneCol.innerHTML = `<div class="kanban-col-title"><span>Concluído</span><span>${concluded.length}</span></div>`;
  concluded.forEach(p=> doneCol.appendChild(kanbanCard(p)));
  wireKanbanColumn(doneCol, type, stages.length, true);
  board.appendChild(doneCol);

  return board;
}

function kanbanCard(p){
  const card = document.createElement('div');
  card.className = 'kanban-card';
  card.draggable = true;
  card.setAttribute('data-procid', p.id);
  card.innerHTML = `
    <div class="kc-client">${escapeHtml(p.client)}</div>
    <div class="kc-sub">${p.responsible ? escapeHtml(p.responsible) : 'Sem responsável'}${p.nextAction ? ' · '+escapeHtml(p.nextAction) : ''}</div>
  `;
  card.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', p.id);
  });
  card.addEventListener('click', ()=> openDetail(p.id));
  return card;
}

function wireKanbanColumn(col, type, stageIndex, isDoneColumn){
  col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
  col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
  col.addEventListener('drop', e=>{
    e.preventDefault();
    col.classList.remove('dragover');
    const procId = e.dataTransfer.getData('text/plain');
    const p = state.processes.find(x=>x.id===procId);
    if(!p || p.type!==type) return;
    if(isDoneColumn){
      if(p.status!=='concluido'){
        p.status = 'concluido';
        p.completedAt = new Date().toISOString();
        p.currentStage = state.settings.stages[type].length - 1;
        addHistory(p, 'Processo concluído (via Kanban).');
        saveProcesses();
        showToast('Processo concluído.');
        render();
      }
    } else {
      if(p.status==='concluido'){
        p.status = 'em_andamento';
        p.completedAt = null;
      }
      if(p.currentStage !== stageIndex){
        p.currentStage = stageIndex;
        addHistory(p, `Etapa movida para "${state.settings.stages[type][stageIndex]}" (via Kanban).`);
        saveProcesses();
        showToast('Etapa atualizada.');
        render();
      }
    }
  });
}

let currentUserEmail = '';
let appStarted = false;
let pollingStarted = false;

// Traduz o motivo real da falha de login, para a pessoa (e o administrador)
// saberem o que corrigir, em vez de uma mensagem única para tudo.
function loginErrorMessage(error){
  const code = String(error.code || '').toLowerCase();
  const msg = String(error.message || '').toLowerCase();
  const status = error.status || 0;
  if(code === 'email_not_confirmed' || msg.indexOf('email not confirmed') >= 0){
    return 'O acesso deste e-mail ainda não foi confirmado. Peça ao administrador para confirmar o seu acesso.';
  }
  if(code === 'invalid_credentials' || msg.indexOf('invalid login credentials') >= 0){
    return 'E-mail ou senha incorretos. Confira se digitou o e-mail completo e a senha exatamente como recebeu (atenção a espaços e letras maiúsculas). Se o erro continuar, peça ao administrador para conferir o seu acesso.';
  }
  if(status === 429 || code.indexOf('rate_limit') >= 0 || msg.indexOf('rate limit') >= 0){
    return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  }
  if(code === 'user_banned' || msg.indexOf('banned') >= 0){
    return 'Este acesso foi bloqueado. Fale com o administrador.';
  }
  if(status === 0 || msg.indexOf('failed to fetch') >= 0 || msg.indexOf('network') >= 0 || String(error.name||'').indexOf('Fetch') >= 0){
    return 'Sem conexão com o servidor. Verifique a sua internet e tente de novo.';
  }
  return 'Não foi possível entrar (' + (error.message || 'erro desconhecido') + '). Avise o administrador.';
}

function renderLoginScreen(prefillError){
  root.innerHTML = '';
  const screen = document.createElement('div');
  screen.className = 'login-screen';
  screen.innerHTML = `
    <div class="login-card">
      <div class="brand-logo-card"><img src="${LOGO_DATA_URI}" alt="LAM Consultoria Contábil Empresarial" style="width:100%;"></div>

      <div class="login-error" id="loginError"></div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login_email" placeholder="nome@lamconsultoria.net.br" autocomplete="username">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login_password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;margin-top:4px;">Entrar</button>
      <button class="login-link" id="forgotBtn">Esqueci minha senha</button>
    </div>
  `;
  root.appendChild(screen);

  const errorEl = screen.querySelector('#loginError');
  const showError = (msg)=>{ errorEl.textContent = msg; errorEl.classList.add('show'); };
  if(prefillError) showError(prefillError);

  async function doLogin(){
    const email = screen.querySelector('#login_email').value.trim().toLowerCase();
    const password = screen.querySelector('#login_password').value;
    if(!email || !password){ showError('Preencha e-mail e senha.'); return; }
    const btn = screen.querySelector('#loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando...';
    let error = null;
    try{
      ({ error } = await sb.auth.signInWithPassword({ email, password }));
    }catch(e){ error = e; }
    btn.disabled = false; btn.textContent = 'Entrar';
    if(error){ showError(loginErrorMessage(error)); return; }
    // onAuthStateChange cuida de abrir o sistema
  }
  screen.querySelector('#loginBtn').addEventListener('click', doLogin);
  screen.querySelector('#login_password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  screen.querySelector('#login_email').addEventListener('keydown', e=>{ if(e.key==='Enter') screen.querySelector('#login_password').focus(); });

  screen.querySelector('#forgotBtn').addEventListener('click', async ()=>{
    const email = screen.querySelector('#login_email').value.trim();
    if(!email){ showError('Digite seu e-mail acima e clique em "Esqueci minha senha" de novo.'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if(error){ showError('Não foi possível enviar o e-mail agora. Tente novamente em alguns minutos.'); return; }
    errorEl.classList.remove('show');
    alert('Se este e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.');
  });
}

async function startApp(user){
  currentUserEmail = (user && user.email) || '';
  currentUserId = (user && user.id) || '';
  const ok = await loadState();
  if(!ok) return;
  if(NEEDS_PASSWORD_SETUP){
    NEEDS_PASSWORD_SETUP = false;
    state.passwordSetup = true;
    openChangePassword();
  }
  if(!pollingStarted){
    pollingStarted = true;
    setInterval(refreshFromServer, 30000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshFromServer(); });
  }
}

function signOut(){
  if(sb) sb.auth.signOut();
}

function openChangePassword(){
  state.drawerMode = 'changePassword';
  render();
}

function renderChangePasswordForm(){
  const wrap = document.createElement('div');
  const setup = !!state.passwordSetup;
  wrap.innerHTML = `
    <div class="drawer-head">
      <div class="drawer-title">${setup ? 'Defina sua senha' : 'Trocar senha'}</div>
      <button class="drawer-close" id="closeDrawerBtn">✕</button>
    </div>
    ${setup ? `<div class="hint" style="margin-bottom:14px;">Bem-vindo(a)! Crie agora a senha que você vai usar para entrar no sistema.</div>` : ''}
    <div class="field">
      <label>${setup ? 'Senha' : 'Nova senha'}</label>
      <input type="password" id="cp_new" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirmar senha</label>
      <input type="password" id="cp_confirm" placeholder="Repita a senha" autocomplete="new-password">
    </div>
    <div class="drawer-actions">
      <button class="btn btn-primary" id="changePasswordBtn">Salvar senha</button>
      <button class="btn btn-ghost" id="cancelChangePasswordBtn">${setup ? 'Fazer isso depois' : 'Cancelar'}</button>
    </div>
  `;
  const leave = ()=>{ state.passwordSetup = false; closeDrawer(); };
  wrap.querySelector('#closeDrawerBtn').addEventListener('click', leave);
  wrap.querySelector('#cancelChangePasswordBtn').addEventListener('click', leave);
  wrap.querySelector('#changePasswordBtn').addEventListener('click', async ()=>{
    const pass = wrap.querySelector('#cp_new').value;
    const again = wrap.querySelector('#cp_confirm').value;
    if(pass.length < 6){ showToast('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if(pass !== again){ showToast('As senhas não coincidem.'); return; }
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){
      const m = String(error.message || '').toLowerCase();
      if(m.indexOf('different') >= 0) showToast('A nova senha precisa ser diferente da atual.');
      else if(m.indexOf('weak') >= 0 || m.indexOf('characters') >= 0) showToast('Senha fraca demais. Use mais caracteres.');
      else showToast('Não foi possível salvar a senha. Tente novamente.');
      return;
    }
    showToast('Senha salva com sucesso.');
    leave();
  });
  return wrap;
}

if(sb){
  sb.auth.onAuthStateChange((event, session)=>{
    if(session){
      if(!appStarted){ appStarted = true; setTimeout(()=> startApp(session.user), 0); }
    } else if(event === 'SIGNED_OUT'){
      appStarted = false;
      setTimeout(()=> renderLoginScreen(), 0);
    }
  });
  sb.auth.getSession().then(({ data })=>{
    if(data.session){
      if(!appStarted){ appStarted = true; startApp(data.session.user); }
    } else if(!appStarted){
      renderLoginScreen(LOGIN_NOTICE);
    }
  });
} else {
  // Supabase ainda não configurado: roda em modo local (sem login).
  loadState();
}
</script>
</body>
</html>
